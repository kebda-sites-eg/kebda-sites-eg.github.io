.hero h1{font-family:'Reem Kufi',Cairo;font-size:44px;line-height:1.2;color:var(--ac);text-shadow:0 4px 20px #0008}
.hero p{margin-top:6px;font-weight:600;font-size:16px;color:#fff}.kind{display:inline-block;margin-bottom:10px;padding:3px 14px;border:1px solid var(--ac);color:var(--ac);border-radius:99px;font-size:13px;font-weight:700}
.rating{margin-top:12px;color:var(--ac);font-weight:700;font-size:14px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{padding:12px 24px;border-radius:13px;font-weight:800;background:var(--p);color:#fff;font-size:15px}.btn.wa{background:#25D366}.btn.ghost{background:transparent;border:1.5px solid #fff8}
section{padding:30px 16px;max-width:760px;margin:auto}h2{font-family:'Reem Kufi',Cairo;font-size:28px;color:var(--p);margin-bottom:6px}
h3{margin:20px 0 8px;font-size:18px;color:var(--dk);border-right:5px solid var(--ac);padding-right:10px}
.grid{display:grid;gap:8px}.it{background:#fff;border:1px solid #f0e3d6;border-radius:13px;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.itl b{font-size:16px}.itl p{font-size:12.5px;color:#8a7568;line-height:1.5}.prs{display:flex;flex-direction:column;gap:3px;align-items:flex-end;white-space:nowrap}
.pr,.sz{background:var(--dk);color:var(--ac);font-weight:800;font-size:13px;padding:2px 11px;border-radius:99px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{border-radius:13px;aspect-ratio:1;object-fit:cover;width:100%}
.info{background:var(--dk);color:#fff;border-radius:18px;padding:20px}.info p{margin:6px 0}.info b{color:var(--ac)}
footer{text-align:center;font-size:12px;color:#8a7568;padding:20px}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 12px;background:#161210;z-index:20}.bar a{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:800;color:#fff;background:var(--p)}.bar a.w{background:#25D366}
